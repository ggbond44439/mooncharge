name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit registry
        run: moon update

      - name: Show toolchain
        run: moon version --all

      - name: Format check
        run: moon fmt --check

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Check all targets
        run: moon check --target all

      - name: Test all targets
        run: moon test --target all

      - name: Build
        run: moon build

      - name: Run examples
        run: |
          moon run examples/frame_roundtrip
          moon run examples/session_walkthrough
          moon run examples/profile_eval
          moon run examples/conformance_audit
          moon run examples/request_correlation
          moon run examples/station_session
          moon run examples/reservation_auth
          moon run examples/timed_profile_eval
          moon run examples/power_conversion
          moon run examples/snapshot_roundtrip
          moon run examples/transport_reconnect
          moon run examples/firmware_diagnostics
          moon run examples/trigger_schedule
          moon run examples/security_logging

      - name: CLI smoke test
        run: |
          moon run cmd/main -- frame '[2,"ci-1","Heartbeat",{}]'
          moon run cmd/main -- versioned 1.6J '[2,"ci-v","Heartbeat",{}]'
          moon run cmd/main -- dispatch cp '[2,"ci-2","Authorize",{"idTag":"RFID-CI"}]'
          moon run cmd/main -- dispatch cp '[2,"ci-hb","Heartbeat",{}]'
          moon run cmd/main -- dispatch cs '[2,"ci-cache","ClearCache",{}]'
          moon run cmd/main -- conformance summary
          moon run cmd/main -- conformance audit cp '[2,"ci-3","StartTransaction",{"connectorId":1,"idTag":"RFID-CI","meterStart":0,"timestamp":"2026-11-20T00:00:00Z"}]'
          moon run cmd/main -- action SetChargingProfile request

      - name: Package and inspect contents
        run: moon package --list
